[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hgvrec"
version = "0.1.0"
description = "Viewing-context scene graphs from on-device VLMs for video recommendation (research PoC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "Pillow",
  "pydantic>=2",
  "PyYAML",
  "tqdm",
]

[project.optional-dependencies]
# Kept in sync with requirements-main.txt / requirements-extra.txt / requirements-dev.txt.
main = ["torch", "transformers>=5.2.0", "vllm>=0.28.0; sys_platform == 'linux'"]
extra = ["hgvrec[main]", "google-genai"]
dev = ["pytest", "ruff"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["artifact_io", "pipeline_runtime", "arm_registry", "rec_experiments", "pipeline_logging", "visual_sampling"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "torch: requires an installed PyTorch runtime and executes training checks",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
